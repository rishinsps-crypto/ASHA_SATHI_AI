{% extends "base.html" %}{% block heading %}ASHA Worker Registration{% endblock %}{% block content %}<div class="page-intro"><div><h1>Create your worker account</h1><p>Registration requires administrator approval before login.</p></div><span class="tag">Approval required</span></div><section class="panel"><form method="post" class="form-grid"><label>Full name *<input name="full_name" required></label><label>Official ASHA Worker ID *<input name="worker_code" required placeholder="ASHA001"></label><label>Mobile number *<input name="mobile" required></label><label>Email (optional)<input type="email" name="email"></label><label>Password *<input type="password" name="password" minlength="8" required></label><label>State *<input name="state" required></label><label>District *<input name="district" required></label><label>Block *<input name="block" required></label><label>Assigned village / area *<input name="village" required></label><label>PHC / Health Centre *<input name="phc" required></label><div class="form-actions"><button class="btn primary">Submit registration</button></div></form></section>{% endblock %}
